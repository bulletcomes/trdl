apiVersion: apps/v1
kind: Deployment
metadata:
  name: trdl
  namespace: trdl
spec:
  template:
    spec:
      # k3d nodes have no zone labels, so spread across nodes instead.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trdl
