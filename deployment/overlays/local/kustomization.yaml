apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local k3d deployment. Uses the base Traefik Ingress with no host rule,
# so the service answers on http://localhost:8080/.
resources:
  - ../../base
images:
  - name: bulletcomes/trdl
    newTag: '5151666'
patches:
  - path: deployment-patch.yaml
