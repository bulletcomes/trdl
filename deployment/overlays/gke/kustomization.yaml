apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Reference overlay for a regional GKE cluster with nodes in three zones.
# Requires KEDA, with Workload Identity for the KEDA operator.
# Not deployed by CI. Replace the host name, static IP name and image tag
# before applying.
resources:
  - ../../base
  - pdb.yaml
  - scaledobject.yaml
  - triggerauthentication.yaml
  - backendconfig.yaml
  - managedcertificate.yaml
images:
  - name: bulletcomes/trdl
    newName: docker.io/bulletcomes/trdl
    newTag: '5151666'
patches:
  - path: deployment-patch.yaml
  - path: service-patch.yaml
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: trdl
