apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Regional GKE (Autopilot) cluster with nodes in three zones.
# Requires KEDA, with Workload Identity for the KEDA operator.
# Deployed by hand, not by CI; see docs/operations.md#deploying-to-gke.
# Set the host name, static IP name, project ID and image tag for your project.
resources:
  - ../../base
  - pdb.yaml
  - scaledobject.yaml
  - triggerauthentication.yaml
  - backendconfig.yaml
  - managedcertificate.yaml
images:
  - name: bulletcomes/trdl
    newName: docker.io/bulletcomes/trdl
    newTag: '72f150d'
patches:
  - path: deployment-patch.yaml
  - path: service-patch.yaml
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: trdl
