apiVersion: apps/v1
kind: Deployment
metadata:
  name: trdl
  namespace: trdl
spec:
  # One replica per zone in a three-zone regional cluster. The HPA owns the
  # count after creation; this is the starting value.
  replicas: 3
  template:
    spec:
      topologySpreadConstraints:
        # Hard rule: zones may differ by at most one pod, so losing a zone
        # never takes out more than a third of the capacity.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trdl
          matchLabelKeys:
            - pod-template-hash
        # Soft rule: within a zone, prefer different nodes.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trdl
          matchLabelKeys:
            - pod-template-hash
