apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: trdl
  namespace: trdl
spec:
  scaleTargetRef:
    name: trdl
  # Never fewer than one pod per zone, so the zone spread and PDB stay meaningful.
  # No scale-to-zero: that would trade away availability.
  minReplicaCount: 3
  maxReplicaCount: 9
  # If Cloud Monitoring can't be read 3 times in a row, run 6 replicas (two per
  # zone) instead of freezing at the current count.
  fallback:
    failureThreshold: 3
    replicas: 6
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    # Primary signal: requests per second at the external load balancer, per replica.
    # Reads Cloud Monitoring through its Prometheus-compatible API (PromQL).
    # KEDA's gcp-stackdriver scaler is deprecated in favour of this.
    # Load balancer metrics arrive with a delay of a few minutes, so this
    # reacts to sustained load, not short spikes.
    - type: prometheus
      authenticationRef:
        name: gcp-workload-identity
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/trdl-515015/location/global/prometheus
        query: >-
          sum(rate(loadbalancing_googleapis_com:https_request_count{monitored_resource="https_lb_rule",backend_target_name=~"k8s1-.*-trdl-trdl-80-.*"}[2m]))
        threshold: "100"
    # Second signal: still scale on CPU if the request metric is slow or unavailable.
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
