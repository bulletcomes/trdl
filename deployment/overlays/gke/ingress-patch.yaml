apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trdl
  namespace: trdl
spec:
  rules:
    - host: trdl.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trdl
                port:
                  number: 80
