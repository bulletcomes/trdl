# Swap the base Traefik Ingress for the GKE Ingress controller, which
# provisions a global external Application Load Balancer.
- op: remove
  path: /spec/ingressClassName
- op: add
  path: /metadata/annotations
  value:
    kubernetes.io/ingress.class: gce
    # Reserve first: gcloud compute addresses create trdl-ip --global
    kubernetes.io/ingress.global-static-ip-name: trdl-ip
    networking.gke.io/managed-certificates: trdl
    kubernetes.io/ingress.allow-http: "false"
- op: replace
  path: /spec/rules
  value:
    - host: 136-82-211-146.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trdl
                port:
                  number: 80
