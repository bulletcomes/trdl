apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: trdl
  namespace: trdl
spec:
  # Load balancer health check, matching the pod readiness probe.
  healthCheck:
    type: HTTP
    requestPath: /readyz
    port: 8080
    checkIntervalSec: 5
    timeoutSec: 3
    healthyThreshold: 1
    unhealthyThreshold: 2
  # Give in-flight requests time to finish when a pod is removed.
  connectionDraining:
    drainingTimeoutSec: 10
