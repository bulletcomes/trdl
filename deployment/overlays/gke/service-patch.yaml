apiVersion: v1
kind: Service
metadata:
  name: trdl
  namespace: trdl
  annotations:
    # Container-native load balancing: the Google load balancer sends traffic
    # straight to pod IPs through network endpoint groups in each zone.
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "trdl"}'
