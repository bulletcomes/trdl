apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trdl
  namespace: trdl
spec:
  # k3d ships Traefik as its ingress controller; the host port 8080 is mapped to it.
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trdl
                port:
                  number: 80
