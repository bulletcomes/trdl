apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Minimal single-replica Prometheus for the local KEDA demo. It only scrapes
# Traefik, so it needs no RBAC. Not intended for production use.
resources:
  - namespace.yaml
  - traefik-metrics-service.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
