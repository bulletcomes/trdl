name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod

      - name: Unit tests
        working-directory: app
        run: go test -race -cover ./...

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize deployment/base >/tmp/base.yaml
          kubectl kustomize deployment/overlays/local >/tmp/local.yaml
          kubectl kustomize deployment/overlays/gke >/tmp/gke.yaml
          kubectl kustomize deployment/overlays/local-keda >/tmp/local-keda.yaml
          kubectl kustomize deployment/addons/prometheus >/tmp/prometheus.yaml
          kubectl kustomize deployment/loadtest >/tmp/loadtest.yaml

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build container
        run: docker build --build-arg VERSION=${{ steps.vars.outputs.short_sha }} -t trdl:${GITHUB_SHA} app

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trdl:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: app
          build-args: VERSION=${{ steps.vars.outputs.short_sha }}
          push: true
          tags: docker.io/bulletcomes/trdl:${{ steps.vars.outputs.short_sha }}
